name: CI

# Workspace-level CI for Kindora V0.1.
#
# We deliberately keep the desktop-app `tauri` build OUT of the
# required checks: it needs platform-specific dependencies and a
# full Rust toolchain, and the `pnpm -r build` + `pnpm -r test` +
# `pnpm -r typecheck` jobs below already cover the TypeScript /
# Rust-lib surface. A tagged-release build workflow does not exist
# yet — installers are not published (see README § Status).
#
# `pnpm lint` and `pnpm format:check` are intentionally NOT gating:
# they are useful locally (`pnpm lint`, `pnpm format`) but were not
# green across the whole tree when this workflow was written, and
# adding a permanently-red required check helps nobody. They become
# gating once the tree is clean.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` input on purpose — the action reads
        # `packageManager` from the root package.json (pnpm@10.32.1).
        # Pinning `version: 9` here would install pnpm 9 against a
        # pnpm-10 lockfile.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Rust lib check (real PASS/FAIL)
        working-directory: apps/desktop/src-tauri
        # `cargo check --lib --message-format=short` validates the Rust
        # library + lan.rs + secrets.rs. Exits non-zero on compile
        # failure; CI must surface this as a real FAIL. We do NOT
        # gate CI on the full `tauri build` because that requires
        # platform-specific tauri-build assets (icons, tauri.conf.json
        # processed by tauri-build) and is verified locally before
        # release tagging.
        run: cargo check --lib --message-format=short

      - name: Rust unit tests
        working-directory: apps/desktop/src-tauri
        # The `--lib` target's own #[test] fns (error -> display-string
        # contracts in lan.rs). No sockets, no timing — safe to run in
        # parallel.
        run: cargo test --lib --message-format=short

      - name: LAN end-to-end Rust tests
        working-directory: apps/desktop/src-tauri
        # Exercises the production LanState (host_start, host_poll,
        # host_send, join_discover, join_connect, host_linked) on real
        # UDP + TCP loopback. The tests allocate unique UDP ports
        # per LanState, but parallel test execution is unreliable on
        # the macOS/Linux kernel UDP buffer pool, so we force
        # --test-threads=1. cargo exits non-zero on any test failure.
        run: cargo test --test lan_e2e --message-format=short -- --test-threads=1

      - name: LAN protocol end-to-end Rust tests
        working-directory: apps/desktop/src-tauri
        # The KSA 0.1 envelope contract over a real socket: build,
        # validate, serialise, replay-guard, rate-limit.
        run: cargo test --test lan_protocol_e2e --message-format=short -- --test-threads=1
