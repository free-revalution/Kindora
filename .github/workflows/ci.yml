name: CI

# Workspace-level CI for Kindora V0.1.
#
# We deliberately keep the desktop-app `tauri` build OUT of the
# required checks: it needs platform-specific dependencies and a
# full Rust toolchain, and the `pnpm -r build` + `pnpm -r test` +
# `pnpm -r typecheck` jobs below already cover the TypeScript /
# Rust-lib surface. The optional `tauri-build` job runs in a
# separate workflow (`tauri.yml`) on tagged releases.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Rust lib check (real PASS/FAIL)
        working-directory: apps/desktop/src-tauri
        # `cargo check --lib --message-format=short` validates the Rust
        # library + lan.rs + secrets.rs. Exits non-zero on compile
        # failure; CI must surface this as a real FAIL. We do NOT
        # gate CI on the full `tauri build` because that requires
        # platform-specific tauri-build assets (icons, tauri.conf.json
        # processed by tauri-build) and is verified locally before
        # release tagging.
        run: cargo check --lib --message-format=short

      - name: LAN end-to-end Rust tests
        working-directory: apps/desktop/src-tauri
        # Exercises the production LanState (host_start, host_poll,
        # host_send, join_discover, join_connect, host_linked) on real
        # UDP + TCP loopback. The tests allocate unique UDP ports
        # per LanState, but parallel test execution is unreliable on
        # the macOS/Linux kernel UDP buffer pool, so we force
        # --test-threads=1. cargo exits non-zero on any test failure.
        run: cargo test --test lan_e2e --message-format=short -- --test-threads=1
