name: Setup Tauri Linux prerequisites
description: >-
  Install the Linux system libraries that the Tauri (wry / WebKitGTK) Rust
  dependency tree needs in order to compile. Every job that runs cargo
  clippy / check / test against apps/desktop/src-tauri on Linux MUST call
  this action first, otherwise the crate's build scripts fail their
  pkg-config probes and cargo exits 101.

runs:
  using: composite
  steps:
    # Tauri v2 on Ubuntu needs the WebKitGTK stack, the appindicator tray
    # library and a few build essentials. The list is the one from
    # https://tauri.app/start/prerequisites/ for Debian/Ubuntu.
    #
    # It is kept byte-identical to the list that the `tauri-build` job
    # proved can compile this crate on a `ubuntu-latest` runner, so the
    # clippy/test job and the Tauri build job always share one build
    # environment. See docs/audits/P0_1_CI_REMEDIATION_REPORT.md.
    - name: Install Tauri Linux prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libxdo-dev
