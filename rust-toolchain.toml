# The dependency tree requires edition2024 (via `idna_adapter` and friends),
# which means Rust 1.85+. The machine-local default on some developer machines
# is still 1.77.2, which fails with:
#
#   error: feature 'edition2024' is required
#
# Pinning `stable` here makes every `cargo` invocation inside this repository
# resolve the correct toolchain automatically, with no manual `PATH` override.
# CI already uses `dtolnay/rust-toolchain@stable`, so this keeps local and CI
# builds on the same toolchain.
[toolchain]
channel = "stable"