# Kindora toolchain policy (P0-2A / A-42 + V6-1):
#
#   - Minimum supported Rust version (MSRV) = **1.90**
#     Declared in both Cargo manifests (`apps/desktop/src-tauri`,
#     `experiments/phase21_experiment_a`) as `rust-version = "1.90"`.
#     CI also runs a dedicated `dtolnay/rust-toolchain@1.90.0` job (A-40).
#
#   - Default *developer* toolchain = **stable**
#     The dependency tree needs edition2024 (via `idna_adapter` and friends),
#     which means Rust ≥ 1.85. Pinning `stable` here makes every local `cargo`
#     invocation resolve a current toolchain automatically. Do **not** change
#     this channel to `1.90.0` — that would freeze everyday development on the
#     MSRV instead of tracking stable (A-42 semantic boundary).
#
# CI already uses `dtolnay/rust-toolchain@stable` for the main jobs, so local
# and CI stay aligned on the default channel while the MSRV gate stays separate.
[toolchain]
channel = "stable"
